<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InferTree · 树状推理</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['\\(', '\\)'], ['$', '$']],
    displayMath: [['\\[', '\\]'], ['$$', '$$']],
  },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] },
  startup: { typeset: false },
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
  :root {
    --bg: #FAF2E0; --panel: #FFFCF5; --border: #D8CDB8; --text: #17324A;
    --accent: #0E61AC; --accent-contrast: #FFFFFF;
    --surface: color-mix(in srgb, var(--panel) 72%, var(--bg));
    --muted: color-mix(in srgb, var(--text) 58%, var(--bg));
    --accent-hover: color-mix(in srgb, var(--accent) 78%, var(--text));
    --accent-soft: color-mix(in srgb, var(--accent) 42%, var(--bg));
    --accent-faint: color-mix(in srgb, var(--accent) 14%, var(--bg));
    --user: color-mix(in srgb, var(--accent) 28%, var(--bg));
    --assistant: color-mix(in srgb, var(--panel) 82%, var(--bg));
    --node: color-mix(in srgb, var(--panel) 64%, var(--bg));
    --node-sel: color-mix(in srgb, var(--accent) 35%, var(--bg));
    --local-accent: color-mix(in srgb, var(--accent) 48%, #6D28D9);
    --local-node: color-mix(in srgb, var(--local-accent) 24%, var(--bg));
    --line: color-mix(in srgb, var(--border) 72%, var(--text));
    --line-sel: var(--accent); --danger: #B64242;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px;
    background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: nowrap;
    overflow-x: auto; scrollbar-width: thin; z-index: 5;
  }
  header > * { flex: 0 0 auto; }
  header h1 { font-size: 15px; margin: 0 3px 0 0; font-weight: 600; }
  header .spacer { flex: 1 1 auto; min-width: 4px; }
  header button, header select { font-size: 12px; padding: 5px 7px; }
  #status { display: inline-block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { max-width: 105px; }
  button, input, select, textarea {
    font-family: inherit; font-size: 13px; color: var(--text); background: var(--bg);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px;
  }
  button, input, select, textarea { outline-color: var(--accent); }
  button { cursor: pointer; background: var(--panel); transition: background .15s, border-color .15s; }
  button:hover { background: var(--accent-faint); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
  button.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); }
  .err { color: var(--danger); }

  #settings { display: none; flex-direction: column; gap: 10px; padding: 14px;
    background: var(--panel); border-bottom: 1px solid var(--border); z-index: 5; }
  #settings.open { display: flex; }
  #settings label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  #settings .row { display: flex; gap: 12px; flex-wrap: wrap; }
  #settings .row > label { flex: 1; min-width: 180px; }
  #evalPanel { padding: 10px; border: 1px solid var(--border); border-radius: 9px;
    background: var(--surface); display: flex; flex-direction: column; gap: 9px; }
  #evalPanel[hidden] { display: none; }
  #evalPanel h2 { margin: 0; font-size: 14px; color: var(--accent); }
  .eval-controls { display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap; }
  .eval-controls label { min-width: 150px; flex: 0 1 auto; }
  #evalModels { display: flex; gap: 6px 12px; flex-wrap: wrap; padding: 7px;
    border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
  #evalModels label { min-width: 0; flex-direction: row; align-items: center; gap: 5px; color: var(--text); }
  #evalModels input { width: auto; }
  .eval-progress { height: 5px; border-radius: 4px; overflow: hidden; background: var(--border); }
  .eval-progress > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #evalSummary { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; }
  #evalSummary span { padding: 4px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); }
  #evalResults { max-height: 300px; overflow: auto; border: 1px solid var(--border); border-radius: 7px; }
  #evalResults table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #evalResults th, #evalResults td { padding: 5px 7px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  #evalResults th { position: sticky; top: 0; z-index: 1; background: var(--panel); }
  #evalResults tr.failed td { background: color-mix(in srgb, var(--danger) 9%, var(--bg)); }
  #evalResults details { max-width: 520px; }
  #evalResults pre { max-height: 140px; overflow: auto; white-space: pre-wrap; margin: 5px 0 0;
    padding: 6px; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); }
  .main { flex: 1; display: flex; min-height: 0; }

  /* 树画布 */
  #treeWrap { flex: 1; position: relative; overflow: hidden; background:
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--accent) 24%, transparent) 1px, transparent 0) 0 0 / 26px 26px, var(--bg);
    cursor: grab; }
  #treeWrap.panning { cursor: grabbing; }
  #treeCanvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #edges { position: absolute; top: 0; left: 0; overflow: visible; pointer-events: none; }
  .node {
    position: absolute; width: 170px; min-height: 46px; padding: 8px 10px;
    background: var(--node); border: 1px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column; gap: 3px; cursor: pointer; user-select: none;
    box-shadow: 0 2px 7px color-mix(in srgb, var(--text) 12%, transparent); transition: border-color .12s, background .12s;
  }
  .node:hover { border-color: var(--accent); }
  .node.sel { background: var(--node-sel); border-color: var(--accent); }
  .node.root { background: color-mix(in srgb, var(--border) 34%, var(--bg)); border-color: var(--border); }
  .node.local-followup { background: var(--local-node); border-color: var(--local-accent); border-left-width: 4px; }
  .node.local-followup.sel { background: color-mix(in srgb, var(--local-accent) 35%, var(--bg));
    box-shadow: 0 0 0 1px var(--local-accent), 0 2px 7px color-mix(in srgb, var(--text) 12%, transparent); }
  .node.local-followup .nt::before { content: '↳ '; color: var(--local-accent); }
  .node .nt { font-size: 13px; font-weight: 600; line-height: 1.3; }
  .node .nmeta { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .node .collapse { position: absolute; right: -11px; top: 50%; transform: translateY(-50%);
    height: 22px; min-width: 22px;
    padding: 0 5px; border-radius: 9px; background: var(--panel); border: 1px solid var(--border);
    color: var(--muted); font-size: 11px; line-height: 1; display: flex; align-items: center;
    justify-content: center; font-weight: 600; }
  .node .collapse:hover { background: var(--accent); color: var(--accent-contrast); border-color: var(--accent); }
  .node.collapsed { border-style: dashed; }
  .node.streaming { border-color: var(--accent); }
  .node.streaming .nt::before { content: ''; display: inline-block; width: 10px; height: 10px;
    border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite; margin-right: 6px; vertical-align: -1px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #viewControls { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; z-index: 4; }

  /* 拖拽分隔条 */
  #resizer { width: 6px; flex-shrink: 0; cursor: col-resize; background: var(--border);
    transition: background .12s; }
  #resizer:hover, #resizer.active { background: var(--accent); }

  /* 内嵌 PDF 阅读器 */
  #pdfPanel { width: min(44vw, 760px); min-width: 360px; flex: 0 0 auto;
    background: var(--panel); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0; }
  #pdfPanel[hidden] { display: none; }
  #pdfHead { min-height: 42px; padding: 6px 9px; display: flex; align-items: center; gap: 7px;
    border-bottom: 1px solid var(--border); }
  #pdfTitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; font-weight: 600; }
  #pdfPageLabel { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #pdfFrame { flex: 1; width: 100%; min-height: 0; border: 0; background: var(--bg); }
  .page-citation { display: inline; padding: 0 3px; border: 0; border-radius: 3px;
    background: var(--accent-faint); color: var(--accent); font: inherit; text-decoration: underline;
    text-underline-offset: 2px; cursor: pointer; }
  .page-citation:hover { background: color-mix(in srgb, var(--accent) 22%, var(--bg)); border: 0; }

  /* 会话侧栏 */
  #side { width: 380px; flex-shrink: 0; background: var(--panel);
    display: flex; flex-direction: column; min-height: 0; position: relative; }
  #convoHead { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; }
  #convoHead b { color: var(--accent); }
  #nodeActions { display: flex; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); }
  #nodeActions button { font-size: 12px; padding: 5px 10px; }
  #nodeActions button.warn { background: var(--danger); border-color: var(--danger); color: #fff; }
  #nodeActions button:disabled { opacity: .4; }
  #convoShell { flex: 1; min-height: 0; position: relative; }
  #convo { height: 100%; overflow-y: auto; padding: 14px 38px 14px 14px;
    display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
  #convo::-webkit-scrollbar { width: 9px; }
  #convo::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text) 25%, var(--bg)); border: 3px solid var(--panel); border-radius: 8px; }
  #convo::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--accent) 55%, var(--bg)); }
  .msg { padding: 9px 12px; border-radius: 9px; white-space: pre-wrap; word-wrap: break-word;
    line-height: 1.45; font-size: 14px; max-width: 100%; transition: box-shadow .2s, background .2s; }
  .msg .role { font-size: 10px; color: var(--muted); margin-bottom: 5px; text-transform: uppercase; letter-spacing: .4px; }
  .msg.user { background: var(--user); align-self: flex-end; }
  .msg.assistant { background: var(--assistant); border: 1px solid var(--border); align-self: flex-start; }
  .msg.system { background: color-mix(in srgb, var(--border) 34%, var(--bg)); border: 1px solid var(--border); align-self: stretch; }
  .msg.user.turn-flash { box-shadow: 0 0 0 2px var(--accent), 0 4px 16px color-mix(in srgb, var(--accent) 22%, transparent); }

  /* DeepSeek 风格的多轮对话快速跳转轨道 */
  #turnNav { position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    z-index: 4; display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
    width: 230px; max-height: min(68%, 330px); overflow-y: auto;
    padding: 6px 1px 6px 200px; scrollbar-width: none; pointer-events: none;
    opacity: .58; transition: opacity .16s; }
  #turnNav[hidden] { display: none; }
  #turnNav::-webkit-scrollbar { display: none; }
  #turnNav:hover, #turnNav:focus-within { opacity: 1; }
  .turn-jump { position: relative; width: 24px; height: 14px; padding: 0; border: 0;
    border-radius: 0; background: transparent; overflow: visible; flex: 0 0 auto;
    pointer-events: auto; }
  .turn-jump:hover, .turn-jump:focus-visible { background: transparent; border: 0; }
  .turn-jump::after { content: ''; position: absolute; right: 1px; top: 6px; width: 8px;
    height: 2px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 46%, var(--bg));
    transition: width .14s, height .14s, background .14s; }
  .turn-jump:hover::after, .turn-jump:focus-visible::after { width: 16px; background: color-mix(in srgb, var(--accent) 72%, var(--text)); }
  .turn-jump.active::after { width: 21px; height: 3px; top: 5px; background: var(--accent); }
  .turn-tip { position: absolute; right: 29px; top: 50%; transform: translateY(-50%) translateX(4px);
    width: 190px; padding: 7px 9px; color: var(--text); background: var(--panel);
    border: 1px solid color-mix(in srgb, var(--accent) 42%, var(--border)); border-radius: 7px;
    box-shadow: 0 5px 18px color-mix(in srgb, var(--text) 16%, transparent);
    font-size: 12px; line-height: 1.35; text-align: left; white-space: normal;
    overflow-wrap: anywhere; pointer-events: none; opacity: 0; visibility: hidden;
    transition: opacity .12s, transform .12s, visibility .12s; }
  .turn-jump:hover .turn-tip, .turn-jump:focus-visible .turn-tip {
    opacity: 1; visibility: visible; transform: translateY(-50%) translateX(0); }
  /* Markdown 渲染样式（限定在回答气泡内） */
  .msg .c { white-space: normal; }
  .msg .c > *:first-child { margin-top: 0; }
  .msg .c > *:last-child { margin-bottom: 0; }
  .msg .c p { margin: 4px 0; }
  .msg .c h1, .msg .c h2, .msg .c h3, .msg .c h4 { margin: 10px 0 4px; line-height: 1.3; }
  .msg .c h1 { font-size: 18px; } .msg .c h2 { font-size: 16px; } .msg .c h3 { font-size: 15px; }
  .msg .c ul, .msg .c ol { margin: 4px 0; padding-left: 22px; }
  .msg .c li { margin: 2px 0; }
  .msg .c code { background: color-mix(in srgb, var(--panel) 64%, var(--border)); border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-family: Consolas, "Courier New", monospace; font-size: 13px; }
  .msg .c pre { background: color-mix(in srgb, var(--panel) 64%, var(--border)); border: 1px solid var(--border); border-radius: 8px; white-space: pre;
    padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
  .msg .c pre code { background: none; border: none; padding: 0; }
  .msg .c blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--accent); color: var(--muted); }
  .msg .c table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .msg .c th, .msg .c td { border: 1px solid var(--border); padding: 5px 9px; }
  .msg .c th { background: color-mix(in srgb, var(--panel) 64%, var(--border)); }
  .msg .c a { color: var(--accent); }
  .msg .c hr { border: none; border-top: 1px solid var(--border); margin: 10px 0; }
  .msg .c img { display: block; max-width: 100%; height: auto; margin: 8px 0;
    border: 1px solid var(--border); border-radius: 6px; }
  .msg .c mjx-container { max-width: 100%; overflow-x: auto; overflow-y: hidden; }
  .msg .c input[type="checkbox"] { width: auto; margin-right: 6px; }
  .msg .reason { margin-bottom: 8px; border-left: 2px solid var(--accent); }
  .msg .reason summary { cursor: pointer; font-size: 12px; color: var(--accent); padding: 2px 0 2px 8px; }
  .msg .reason .rc { font-size: 12px; color: var(--muted); white-space: pre-wrap;
    line-height: 1.45; padding: 6px 0 4px 8px; max-height: 280px; overflow-y: auto; }
  .msg .snote { font-size: 12px; color: var(--accent); margin-bottom: 6px;
    background: var(--accent-faint); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border)); border-radius: 6px; padding: 4px 8px; }
  .msg .activity { margin: 0 0 8px; border: 1px solid var(--border); border-radius: 7px;
    background: var(--surface); white-space: normal; }
  .msg .activity[hidden] { display: none; }
  .msg .activity summary { cursor: pointer; padding: 6px 8px; color: var(--accent); font-size: 12px;
    user-select: none; }
  .msg .activity .alist { padding: 0 8px 7px; display: flex; flex-direction: column; gap: 4px; }
  .msg .activity .arow { display: grid; grid-template-columns: 15px minmax(0, 1fr) auto;
    gap: 6px; align-items: start; padding: 4px 0; font-size: 12px; color: var(--muted); }
  .msg .activity .arow.kind-tool { margin-left: 10px; }
  .msg .activity .arow.kind-artifact { margin-left: 20px; }
  .msg .activity .aicon { width: 12px; height: 12px; text-align: center; color: #6fd19b; }
  .msg .activity .arow.state-started .aicon { border: 2px solid color-mix(in srgb, var(--text) 25%, var(--bg)); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; font-size: 0; }
  .msg .activity .arow.state-failed .aicon,
  .msg .activity .arow.state-cancelled .aicon { color: var(--danger); }
  .msg .activity .atitle { color: var(--text); font-weight: 600; }
  .msg .activity .amsg { margin-top: 1px; line-height: 1.35; overflow-wrap: anywhere; }
  .msg .activity .ameta { color: #7C858B; font-size: 11px; white-space: nowrap; }
  .msg .local-reference { margin: 0 0 6px; padding: 5px 8px; max-height: 72px; overflow: hidden;
    border-left: 3px solid var(--local-accent); border-radius: 4px;
    background: color-mix(in srgb, var(--local-accent) 12%, var(--bg)); color: var(--muted);
    font-size: 12px; line-height: 1.35; white-space: normal; }
  #composer { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  #composer .prompt-controls { display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
    padding-bottom: 7px; border-bottom: 1px solid var(--border); }
  #composer .prompt-controls select, #composer .prompt-controls button { font-size: 11px; padding: 4px 6px; min-width: 0; }
  #composer .prompt-controls label { display: inline-flex; align-items: center; gap: 4px;
    color: var(--muted); font-size: 11px; white-space: nowrap; }
  #composer .prompt-controls input[type="checkbox"] { width: auto; margin: 0; }
  #modelSelect { max-width: 138px; }
  #skillSelect { max-width: 144px; }
  #skillModeSelect { max-width: 116px; }
  #quickActions { display: flex; gap: 5px; flex-wrap: wrap; padding: 2px 0; }
  #quickActions button { font-size: 11px; padding: 4px 8px; }
  .node-ui { margin-top: 8px; }
  .node-ui:empty { display: none; }
  .ui-options { display: flex; flex-wrap: wrap; gap: 6px; }
  .option-btn { font-size: 12px; font-weight: 400; padding: 5px 10px;
    border: 1px solid var(--border); color: var(--text); background: var(--bg);
    border-radius: 6px; cursor: pointer; transition: background .15s, border-color .15s; }
  .option-btn:hover { background: var(--accent-faint); border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .option-btn.other-option { border-style: dashed; }
  .ui-confirm { border: 1px solid var(--border); background: var(--accent-faint); border-radius: 8px; padding: 10px 12px; }
  .ui-confirm-title { font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 4px; }
  .ui-confirm-message { font-size: 13px; color: var(--text); margin-bottom: 8px; white-space: pre-wrap; }
  .ui-confirm-actions { display: flex; gap: 6px; }
  .ui-input { border: 1px dashed var(--border); background: var(--bg); border-radius: 8px; padding: 8px 10px; }
  .ui-input-label { font-weight: 600; font-size: 13px; color: var(--text); margin-bottom: 6px; }
  .ui-input-row { display: flex; gap: 6px; }
  .ui-input-row input { flex: 1; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; }
  #thinkEffort { max-width: 74px; }
  #paperStatus { display: inline-block; max-width: 104px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; vertical-align: middle; }
  #thinkingHint { width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #composer .clabel { font-size: 12px; color: var(--muted); }
  #composer .clabel.local-active { color: var(--text); padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--local-accent); background: color-mix(in srgb, var(--local-accent) 12%, var(--bg)); }
  #composer .local-title { color: var(--local-accent); font-weight: 650; }
  #composer .local-preview { margin-left: 6px; color: var(--muted); }
  #composer .context-badge { display: inline-block; margin-left: 6px; padding: 1px 5px;
    border: 1px solid var(--border); border-radius: 5px; color: var(--muted);
    background: var(--surface); font-size: 11px; white-space: nowrap; }
  #composer .clear-local { float: right; border: 0; background: transparent; color: var(--muted);
    padding: 0 2px; font-size: 14px; line-height: 1; }
  #composer .clear-local:hover { color: var(--text); background: transparent; border: 0; }
  #composer .row { display: flex; gap: 8px; align-items: flex-end; }
  #input { flex: 1; resize: none; min-height: 42px; max-height: 160px; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1>InferTree</h1>
  <span class="hint" id="status">未配置</span>
  <button id="undoBtn" title="撤销 (Ctrl+Z)">↩ 撤销</button>
  <button id="redoBtn" title="重做 (Ctrl+Y)">↪ 重做</button>
  <span class="spacer"></span>
  <button id="newTreeBtn" title="新建对话树">新建</button>
  <button id="exportMd" title="导出当前路径 Markdown">导出 MD</button>
  <button id="exportJson" title="导出完整对话树 JSON">导出 JSON</button>
  <button id="importBtn" title="导入对话树 JSON">导入</button>

<script>
const $ = id => document.getElementById(id);
const els = {
  system: $('systemPrompt'),
  thinkOn: $('thinkOn'), thinkEffort: $('thinkEffort'),
  thinkToggleWrap: $('thinkToggleWrap'), thinkEffortWrap: $('thinkEffortWrap'),
  thinkToggleLabel: $('thinkToggleLabel'), thinkingHint: $('thinkingHint'),
  model: $('modelSelect'),
  status: $('status'), settings: $('settings'),
  wrap: $('treeWrap'), canvas: $('treeCanvas'), svg: $('edges'),
  convo: $('convo'), pathLabel: $('pathLabel'), branchLabel: $('branchLabel'),
  turnNav: $('turnNav'),
  input: $('input'), send: $('sendBtn'), stop: $('stopBtn'),
  regen: $('regenBtn'), del: $('delBtn'),
  viewPdf: $('viewPdfBtn'), pdfPanel: $('pdfPanel'), pdfFrame: $('pdfFrame'),
  pdfTitle: $('pdfTitle'), pdfPageLabel: $('pdfPageLabel'), closePdf: $('closePdfBtn'),
  undo: $('undoBtn'), redo: $('redoBtn'),
  paperFile: $('paperFile'), paperStatus: $('paperStatus'), skill: $('skillSelect'),
  skillMode: $('skillModeSelect'),
  quickActions: $('quickActions'),
  evalPanel: $('evalPanel'), evalSuite: $('evalSuiteSelect'), evalRepeat: $('evalRepeat'),
  evalStart: $('evalStartBtn'), evalCancel: $('evalCancelBtn'), evalRefresh: $('evalRefreshBtn'),
  evalRun: $('evalRunSelect'), evalModels: $('evalModels'), evalModelWrap: $('evalModelWrap'),
  evalSuiteHint: $('evalSuiteHint'), evalCostHint: $('evalCostHint'),
  evalProgress: $('evalProgressBar'), evalSummary: $('evalSummary'), evalResults: $('evalResults'),
};
const paperMetadataRequests = new Map();

function getLegacyActivePaper() {
  try { return JSON.parse(safeLocalStorageGet('activePaper', 'null') || 'null'); }
  catch (_) { return null; }
}

function paperMetadataForId(paperId) {
  if (!paperId) return null;
  for (const node of Object.values(nodes || {})) {
    if (node.paper?.paperId === paperId) return node.paper;
  }
  const legacy = getLegacyActivePaper();
  return legacy?.paperId === paperId
    ? legacy : { paperId, title: '关联论文', needsMetadata: true };
}

function paperForNode(nodeId = selectedId) {
  let currentId = nodeId;
  while (currentId && nodes[currentId]) {
    const node = nodes[currentId];
    if (node.paper?.paperId) return node.paper;
    if (node.paperId) return paperMetadataForId(node.paperId);
    currentId = node.parentId;
  }
  return null;
}

async function hydratePaperMetadata(paperId) {
  if (!paperId || paperMetadataRequests.has(paperId)) {
    return paperMetadataRequests.get(paperId);
  }
  const request = (async () => {
    try {
      const response = await fetch(`/api/papers/${encodeURIComponent(paperId)}/metadata`);
      const result = await response.json();
      if (!response.ok) throw new Error(result.detail || `HTTP ${response.status}`);
      const paper = {
        paperId: result.paper_id,
        title: result.title,
        pageCount: result.page_count,
      };
      let changed = false;
      for (const node of Object.values(nodes)) {
        if (node.paperId !== paperId || node.paper?.paperId) continue;
        node.paper = { ...paper };
        changed = true;
      }
      if (changed) {
        saveTree();
        updateNodePaperUi();
      }
      return paper;
    } catch (error) {
      console.warn(`无法读取节点论文 ${paperId.slice(0, 12)}… 的标题。`, error);
      return null;
    } finally {
      paperMetadataRequests.delete(paperId);
    }
  })();
  paperMetadataRequests.set(paperId, request);
  return request;
}

function bindPaperToNode(nodeId, paper) {
  const node = nodes[nodeId];
  if (!node || !paper?.paperId) return false;
  node.paperId = paper.paperId;
  node.paper = { ...paper };
  updateNodePaperUi();
  saveTree();
  return true;
}

function migrateLegacyPaper(paper) {
  if (!paper?.paperId || !rootId || !nodes[rootId]) return false;
  let matched = false;
  for (const node of Object.values(nodes)) {
    if (node.paperId !== paper.paperId || node.paper?.paperId) continue;
    node.paper = { ...paper };
    matched = true;
  }
  if (!matched && nodes[selectedId]) {
    nodes[selectedId].paperId = paper.paperId;
    nodes[selectedId].paper = { ...paper };
    matched = true;
  }
  safeLocalStorageRemove('activePaper');
  return matched;
}

function compactText(value, maxChars = 14) {
  const text = String(value || '').replace(/\s+/g, ' ').trim();
  return text.length > maxChars ? `${text.slice(0, maxChars)}…` : text;
}

function setPaperStatus(paper, suffix = '') {
  els.viewPdf.hidden = !paper?.paperId;
  els.viewPdf.textContent = paper
    ? `阅读 PDF · ${compactText(paper.title || paper.filename || '论文', 10)}`
    : '阅读 PDF';
  els.viewPdf.title = paper
    ? `阅读本分支论文：${paper.title || paper.filename || paper.paperId}`
    : '当前分支没有绑定 PDF';
  if (!paper) {
    els.paperStatus.textContent = '当前分支未绑定论文';
    els.paperStatus.title = '';
    closePdfViewer();
    return;
  }
  const fullName = paper.filename || paper.title || '论文 PDF';
  const pages = paper.pageCount ?? paper.page_count;
  const pageLabel = pages ? ` · ${pages} 页` : '';
  els.paperStatus.textContent = `本分支：${compactText(fullName)}${pageLabel}${suffix}`;
  els.paperStatus.title = `${fullName}${pageLabel}${suffix}`;
}

function setPaperNotice(shortText, fullText = shortText) {
  els.paperStatus.textContent = shortText;
  els.paperStatus.title = fullText;
}

function updateNodePaperUi() {
  const paper = paperForNode(selectedId);
  const openPaperId = els.pdfFrame.dataset.paperId || '';
  setPaperStatus(paper);
  if (paper?.needsMetadata) hydratePaperMetadata(paper.paperId);
  if (!els.pdfPanel.hidden && paper?.paperId && openPaperId !== paper.paperId) {
    openPdfAtPage(1, paper);
  } else if (!els.pdfPanel.hidden && paper?.paperId === openPaperId) {
    els.pdfTitle.textContent = paper.filename || paper.title || '论文 PDF';
    els.pdfTitle.title = paper.filename || paper.title || '论文 PDF';
  }
}

function safeLocalStorageGet(key, fallback = null) {
  try { return localStorage.getItem(key) ?? fallback; }
  catch (error) {
    reportStorageWarning('浏览器存储不可用：Agent 仍可运行，但刷新页面后无法保留会话和设置。');
    console.error(`读取浏览器设置 ${key} 失败。`, error);
    return fallback;
  }
}

function safeLocalStorageRemove(key) {
  try { localStorage.removeItem(key); }
  catch (error) { console.warn(`清理浏览器设置 ${key} 失败。`, error); }
}

function safeLocalStorageSet(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch (error) {
    reportStorageWarning('浏览器存储不可用或空间不足：当前操作会继续，但部分设置可能无法保留。');
    console.error(`保存浏览器设置 ${key} 失败。`, error);
    return false;
  }
}

async function uploadPaper(file) {
  if (!file) return;
  const targetNodeId = selectedId;
  setPaperNotice(`正在解析 ${compactText(file.name, 10)}…`, `正在解析 ${file.name}…`);
  const body = new FormData();
  body.append('file', file);
  try {
    const response = await fetch('/api/papers', { method: 'POST', body });
    const result = await response.json();
    if (!response.ok) throw new Error(result.detail || `HTTP ${response.status}`);
    const active = {
      paperId: result.paper_id,
      filename: result.filename,
      title: result.title,
      pageCount: result.page_count,
    };
    if (!bindPaperToNode(targetNodeId, active)) throw new Error('上传期间目标节点已不存在');
  } catch (error) {
    setPaperNotice('论文解析失败', `论文解析失败：${error.message}`);
  } finally {
    els.paperFile.value = '';
  }
}

/* ===================== 配置 ===================== */
const UI_THEME_VARIABLES = {
  background: '--bg', panel: '--panel', text: '--text', border: '--border', accent: '--accent',
};

function rgbFromHex(value) {
  if (!/^#[0-9a-f]{6}$/i.test(value || '')) return null;
  return [1, 3, 5].map(index => parseInt(value.slice(index, index + 2), 16));
}

function relativeLuminance(hex) {
  const rgb = rgbFromHex(hex);
  if (!rgb) return 0;
  const linear = rgb.map(channel => {
    const value = channel / 255;
    return value <= .03928 ? value / 12.92 : ((value + .055) / 1.055) ** 2.4;
  });
  return .2126 * linear[0] + .7152 * linear[1] + .0722 * linear[2];
}

function contrastRatio(first, second) {
  const lighter = Math.max(relativeLuminance(first), relativeLuminance(second));
  const darker = Math.min(relativeLuminance(first), relativeLuminance(second));
  return (lighter + .05) / (darker + .05);
}

function applyUiTheme(theme) {
  if (!theme || typeof theme !== 'object') return;
  const root = document.documentElement.style;
  for (const [key, variable] of Object.entries(UI_THEME_VARIABLES)) {
    if (/^#[0-9a-f]{6}$/i.test(theme[key] || '')) root.setProperty(variable, theme[key]);
  }
  const accent = theme.accent || '#0E61AC';
  const preferredText = theme.text || '#17324A';
  let contrast = preferredText;
  if (contrastRatio(accent, preferredText) < 4.5) {
    contrast = contrastRatio(accent, '#FFFFFF') >= contrastRatio(accent, '#000000')
      ? '#FFFFFF' : '#000000';
  }
  root.setProperty('--accent-contrast', contrast);
}

async function loadUiTheme() {
  try {
    const response = await fetch('/api/ui-config');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const result = await response.json();
    applyUiTheme(result.theme);
    applyContextPolicy(result.context);
  } catch (error) {
    console.warn('无法读取自定义界面与上下文设置，继续使用内置配置。', error);
  }
}

function loadCfg() {
  els.system.value  = safeLocalStorageGet('systemPrompt', '') || '';
  const savedSkill = safeLocalStorageGet('activeSkill', 'auto');
  els.skill.value = !savedSkill ? 'auto' : savedSkill;
  if (![...els.skill.options].some(option => option.value === els.skill.value)) els.skill.value = 'auto';
  els.skillMode.value = safeLocalStorageGet('activeSkillMode', 'auto') || 'auto';
  updateSkillModeState();
  // One-time cleanup of credentials saved by the retired browser-direct client.
  ['baseUrl', 'model', 'apiKey', 'webOn', 'tavilyKey', 'thinkOn', 'thinkEffort']
    .forEach(safeLocalStorageRemove);
}
function saveCfg() {
  safeLocalStorageSet('systemPrompt', els.system.value);
  if (els.model.value) {
    safeLocalStorageSet('activeModelId', els.model.value);
    safeLocalStorageSet(`reasoning:${els.model.value}`, JSON.stringify(currentReasoningControl()));
  }
}
let modelCatalog = new Map();
let defaultModelId = '';

function selectedModelProfile(modelId = els.model.value) {
  return modelCatalog.get(modelId) || null;
}
function currentReasoningControl() {
  const policy = selectedModelProfile()?.reasoning;
  if (!policy) return {};
  const enabled = policy.always_enabled ? true : els.thinkOn.checked;
  const control = { enabled };
  if (enabled && policy.efforts?.length) control.effort = els.thinkEffort.value;
  return control;
}
function storedReasoning(modelId, policy) {
  try {
    const saved = JSON.parse(safeLocalStorageGet(`reasoning:${modelId}`, 'null') || 'null');
    if (saved && typeof saved.enabled === 'boolean') return saved;
  } catch (_) {}
  return { enabled: policy.default_enabled, effort: policy.default_effort };
}
function updateReasoningControls(loadStored = true) {
  const profile = selectedModelProfile();
  const policy = profile?.reasoning;
  if (!policy) {
    els.thinkToggleWrap.hidden = true;
    els.thinkEffortWrap.hidden = true;
    els.thinkingHint.textContent = '该模型没有可用的思考控制。';
    return;
  }
  const saved = loadStored
    ? storedReasoning(profile.id, policy)
    : { enabled: els.thinkOn.checked, effort: els.thinkEffort.value || policy.default_effort };
  els.thinkToggleWrap.hidden = false;
  els.thinkOn.checked = policy.always_enabled ? true : saved.enabled;
  els.thinkOn.disabled = !policy.can_toggle;
  els.thinkToggleLabel.textContent = policy.always_enabled ? '深入思考（模型强制开启）' : '深入思考';
  els.thinkEffort.innerHTML = '';
  for (const effort of policy.efforts || []) {
    const option = document.createElement('option');
    option.value = effort; option.textContent = effort;
    els.thinkEffort.appendChild(option);
  }
  const wanted = saved.effort || policy.default_effort;
  if ([...els.thinkEffort.options].some(option => option.value === wanted)) {
    els.thinkEffort.value = wanted;
  }
  els.thinkEffortWrap.hidden = !policy.efforts?.length || !els.thinkOn.checked;
  const warning = profile.documentation_status === 'verified' ? '' : ` 注意：${profile.note}`;
  els.thinkingHint.textContent = `${profile.vendor} · ${policy.hint}${warning}`;
  els.model.title = profile.note || `选择 ${profile.label}`;
}
function titleReasoningControl(modelId) {
  const policy = selectedModelProfile(modelId)?.reasoning;
  if (!policy) return {};
  if (policy.always_enabled) {
    const effort = policy.efforts?.includes('low') ? 'low' : policy.default_effort;
    return effort ? { enabled: true, effort } : { enabled: true };
  }
  return { enabled: false };
}
async function loadModelCatalog() {
  try {
    const response = await fetch('/api/models');
    const result = await response.json();
    if (!response.ok) throw new Error(result.detail || `HTTP ${response.status}`);
    modelCatalog = new Map((result.models || []).map(profile => [profile.id, profile]));
    defaultModelId = result.default_model_id || modelCatalog.keys().next().value || '';
    els.model.innerHTML = '';
    const groups = new Map();
    for (const profile of modelCatalog.values()) {
      if (!groups.has(profile.vendor)) {
        const group = document.createElement('optgroup');
        group.label = profile.vendor; groups.set(profile.vendor, group); els.model.appendChild(group);
      }
      const option = document.createElement('option');
      option.value = profile.id; option.textContent = profile.label;
      groups.get(profile.vendor).appendChild(option);
    }
    const saved = safeLocalStorageGet('activeModelId');
    els.model.value = modelCatalog.has(saved) ? saved : defaultModelId;
    els.model.disabled = !els.model.value;
    updateReasoningControls();
  } catch (error) {
    els.model.innerHTML = '<option value="">模型列表加载失败</option>';
    els.model.disabled = true;
    els.thinkingHint.textContent = `模型列表加载失败：${error.message}`;
  }
}

/* ===================== Agent 评测 ===================== */
let evalSuiteCatalog = new Map();
let currentEvalRunId = '';
let evalPollTimer = null;

function selectedEvalModels() {
  return [...els.evalModels.querySelectorAll('input[type="checkbox"]:checked')]
    .map(input => input.value);
}

function renderEvalModels() {
  els.evalModels.replaceChildren();
  for (const profile of modelCatalog.values()) {
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox'; checkbox.value = profile.id;
    checkbox.checked = profile.id === (els.model.value || defaultModelId);
    checkbox.addEventListener('change', updateEvalCostHint);
    label.append(checkbox, document.createTextNode(profile.label));
    els.evalModels.appendChild(label);
  }
}

function selectedEvalSuite() { return evalSuiteCatalog.get(els.evalSuite.value) || null; }

function updateEvalCostHint() {
  const suite = selectedEvalSuite();
  if (!suite) { els.evalCostHint.textContent = ''; return; }
  const fixture = suite.mode === 'fixture';
  els.evalModelWrap.hidden = fixture;
  const repeats = Number.parseInt(els.evalRepeat.value, 10) || 1;
  const modelCount = fixture ? 1 : selectedEvalModels().length;
  const samples = suite.case_count * repeats * modelCount;
  els.evalSuiteHint.textContent = suite.description || '';
  els.evalCostHint.textContent = fixture
    ? `本地运行 · ${samples} 个样本 · 不调用模型或 Tavily`
    : `预计 ${samples} 次 Agent 样本（${suite.case_count} 用例 × ${modelCount} 模型 × ${repeats} 次）；会使用实际模型额度。`;
}

async function loadEvalSuites() {
  if (!modelCatalog.size) await loadModelCatalog();
  const response = await fetch('/api/evals/suites');
  const result = await response.json();
  if (!response.ok) throw new Error(result.detail || `HTTP ${response.status}`);
  evalSuiteCatalog = new Map((result.suites || []).map(suite => [suite.id, suite]));
  const previous = els.evalSuite.value;
  els.evalSuite.replaceChildren();
  for (const suite of evalSuiteCatalog.values()) {
    const option = document.createElement('option');
    option.value = suite.id;
    option.textContent = `${suite.mode === 'fixture' ? '本地' : 'Agent'} · ${suite.name} (${suite.case_count})`;
    els.evalSuite.appendChild(option);
  }
  if (evalSuiteCatalog.has(previous)) els.evalSuite.value = previous;
  renderEvalModels(); updateEvalCostHint();
}

function evalStatusLabel(status) {
  return ({ queued: '排队中', running: '运行中', cancelling: '取消中', completed: '已完成',
    cancelled: '已取消', failed: '失败', interrupted: '被重启中断' })[status] || status || '未知';
}

function addEvalSummary(label, value) {
  const item = document.createElement('span');
  item.textContent = `${label}：${value}`; els.evalSummary.appendChild(item);
}

function renderEvalRun(run) {
  currentEvalRunId = run.id || currentEvalRunId;
  const planned = Number(run.planned_samples || 0);
  const completed = Number(run.completed_samples || 0);
  els.evalProgress.style.width = `${planned ? Math.min(100, completed / planned * 100) : 0}%`;
  const active = ['queued', 'running', 'cancelling'].includes(run.status);
  els.evalStart.disabled = active; els.evalCancel.disabled = !active;
  els.evalSummary.replaceChildren();
  addEvalSummary('状态', evalStatusLabel(run.status));
  addEvalSummary('进度', `${completed}/${planned}`);
  const overall = run.summary?.overall;
  if (overall?.sample_count) {
    addEvalSummary('通过率', `${Math.round(overall.pass_rate * 100)}%`);
    addEvalSummary('平均分', Number(overall.average_score).toFixed(2));
    addEvalSummary('平均延迟', `${overall.average_latency_ms} ms`);
  }
  for (const [modelId, summary] of Object.entries(run.summary?.models || {})) {
    const label = modelCatalog.get(modelId)?.label || modelId;
    addEvalSummary(label, `${Math.round(summary.pass_rate * 100)}% · ${Number(summary.average_score).toFixed(2)}`);
  }

  els.evalResults.replaceChildren();
  const samples = Array.isArray(run.samples) ? run.samples : [];
  if (!samples.length) {
    const empty = document.createElement('div'); empty.className = 'hint'; empty.style.padding = '8px';
    empty.textContent = active ? '等待第一个样本完成…' : '该运行没有样本结果。';
    els.evalResults.appendChild(empty); return;
  }
  const table = document.createElement('table');
  const head = document.createElement('thead');
  const header = document.createElement('tr');
  for (const label of ['用例', '模型', '结果', '分数', '延迟', '详情']) {
    const th = document.createElement('th'); th.textContent = label; header.appendChild(th);
  }
  head.appendChild(header); table.appendChild(head);
  const body = document.createElement('tbody');
  for (const sample of samples) {
    const row = document.createElement('tr');
    if (!sample.passed) row.className = 'failed';
    const failedGraders = (sample.grades || []).filter(grade => !grade.passed);
    const values = [
      sample.case_name || sample.case_id,
      modelCatalog.get(sample.model_id)?.label || sample.model_id,
      sample.passed ? '通过' : '未通过',
      Number(sample.score || 0).toFixed(2),
      `${sample.latency_ms || 0} ms`,
    ];
    for (const value of values) { const td = document.createElement('td'); td.textContent = value; row.appendChild(td); }
    const detailCell = document.createElement('td');
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = sample.error ? '错误' : `回答 · ${failedGraders.length} 个失败 grader`;
    const graderText = document.createElement('div'); graderText.className = 'hint';
    graderText.textContent = failedGraders.length
      ? `失败：${failedGraders.map(grade => grade.name || grade.type).join('、')}`
      : '全部 grader 通过';
    const output = document.createElement('pre');
    output.textContent = sample.error || sample.output || '（无可见回答）';
    details.append(summary, graderText, output); detailCell.appendChild(details); row.appendChild(detailCell);
    body.appendChild(row);
  }
  table.appendChild(body); els.evalResults.appendChild(table);
}

async function pollEvalRun(runId, keepPolling = true) {
  clearTimeout(evalPollTimer);
  if (!runId) return;
  try {
    const response = await fetch(`/api/evals/runs/${encodeURIComponent(runId)}`);
    const run = await response.json();
    if (!response.ok) throw new Error(run.detail || `HTTP ${response.status}`);
    renderEvalRun(run);
    if (keepPolling && ['queued', 'running'].includes(run.status)) {
      evalPollTimer = setTimeout(() => pollEvalRun(runId), 800);
    } else if (!['queued', 'running'].includes(run.status)) {
      loadEvalHistory(false);
    }
  } catch (error) {
    els.evalSuiteHint.textContent = `读取评测运行失败：${error.message}`;
  }
}

async function loadEvalHistory(selectLatest = true) {
  try {
    const response = await fetch('/api/evals/runs?limit=20');
    const result = await response.json();
    if (!response.ok) throw new Error(result.detail || `HTTP ${response.status}`);
    const runs = result.runs || [];
    els.evalRun.replaceChildren();
    if (!runs.length) {
      const option = document.createElement('option'); option.value = ''; option.textContent = '暂无运行';
      els.evalRun.appendChild(option); return;
    }
    for (const run of runs) {
      const option = document.createElement('option'); option.value = run.id;
      option.textContent = `${evalStatusLabel(run.status)} · ${run.suite_name || run.suite_id} · ${run.created_at || ''}`;
      els.evalRun.appendChild(option);
    }
    const wanted = currentEvalRunId && runs.some(run => run.id === currentEvalRunId)
      ? currentEvalRunId : runs[0].id;
    els.evalRun.value = wanted;
    if (selectLatest && wanted) pollEvalRun(wanted, false);
  } catch (error) {
    els.evalSuiteHint.textContent = `读取评测历史失败：${error.message}`;
  }
}

async function openEvalPanel() {
  els.settings.classList.add('open'); els.evalPanel.hidden = false;
  try { await loadEvalSuites(); await loadEvalHistory(); }
  catch (error) { els.evalSuiteHint.textContent = `评测控制台加载失败：${error.message}`; }
}

async function startEvalRunFromUi() {
  const suite = selectedEvalSuite();
  if (!suite) return;
  const modelIds = suite.mode === 'fixture' ? [] : selectedEvalModels();
  if (suite.mode === 'agent' && !modelIds.length) { alert('请至少选择一个参与评测的模型。'); return; }
  const repeat = Number.parseInt(els.evalRepeat.value, 10) || 1;
  const samples = suite.case_count * repeat * (suite.mode === 'fixture' ? 1 : modelIds.length);
  if (suite.mode === 'agent' && !confirm(`将运行 ${samples} 个真实 Agent 样本并消耗模型额度，是否继续？`)) return;
  els.evalStart.disabled = true;
  try {
    const response = await fetch('/api/evals/runs', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ suite_id: suite.id, model_ids: modelIds, repeat }),
    });
    const run = await response.json();
    if (!response.ok) throw new Error(run.detail || `HTTP ${response.status}`);
    currentEvalRunId = run.id; renderEvalRun(run); pollEvalRun(run.id);
  } catch (error) {
    els.evalStart.disabled = false;
    els.evalSuiteHint.textContent = `启动评测失败：${error.message}`;
  }
}

async function cancelCurrentEval() {
  if (!currentEvalRunId) return;
  els.evalCancel.disabled = true;
  try {
    const response = await fetch(`/api/evals/runs/${encodeURIComponent(currentEvalRunId)}/cancel`, { method: 'POST' });
    const result = await response.json();
    if (!response.ok) throw new Error(result.detail || `HTTP ${response.status}`);
    els.evalSuiteHint.textContent = result.cancel_requested
      ? '已请求取消；当前样本结束或超时后停止后续样本。' : `运行已处于${evalStatusLabel(result.status)}状态。`;
    pollEvalRun(currentEvalRunId);
  } catch (error) { els.evalSuiteHint.textContent = `取消评测失败：${error.message}`; }
}
